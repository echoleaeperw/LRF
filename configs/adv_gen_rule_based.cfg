
# save options
out: ./out/adv_gen_rule_based_out

# data options
data_dir: ./data/nuscenes
data_version: trainval
split: val
val_size: 400 # num scenes
seq_interval: 10 # 5 seconds between sequences.
shuffle: False
num_workers: 0
batch_size: 1 # sets the approximate num agents across all scenes being optimized

# traffic model weights
ckpt: ./model_ckpt/traffic_model.pth

# how to operate
feasibility_check_sep: True
planner: 'ego'
planner_cfg: 'default'

viz: True
save: True # save the scenarios
include_field_visualization: False

# optimization options
num_iters: 200
lr: 0.05

# init optim
init_loss_motion_prior_ext: 0.01
init_loss_match_ext: 10.0
# adv optim
loss_coll_veh: 20.0
loss_coll_veh_plan: 20.0
loss_coll_env: 20.0
loss_init_z: 0.5 
loss_init_z_atk: 0.05
loss_motion_prior: 1.0
loss_motion_prior_atk: 0.005
loss_motion_prior_ext: 0.0001
loss_match_ext: 10.0
loss_adv_crash: 5.0
# 新增损失权重
loss_ttc: 5
# thw 与 ttc 互补：速度相近时 TTC=∞无梯度，THW 仍有梯度
# 纵向急刹场景建议 2.0–3.5；横向/路口场景建议 0.5–1.0
loss_thw: 1.0
loss_min_dist_lat: 5
loss_yaw_rate: 5    
loss_yaw_rate_ego: 5
loss_yaw_rate_non_ego: 5
# 运动学可行性软约束（防止极端加速度/速度/Jerk 产生"捷径解"）
# kine_veh: 背景车辆（严格上限：v≤20m/s, a≤5m/s², j≤10m/s³）
# kine_atk: 攻击车辆（放宽上限：v≤30m/s, a≤9m/s², j≤18m/s³）
loss_kine_veh: 0.5
loss_kine_atk: 0.1
# LLM 设置
use_llm: True   
llm_config_path: configs/llm_weights_config.yaml
# llm_cache_dir: ./llm_cache  # 注释掉=禁用缓存，每次调用LLM(计时测试用)
llm_model: siliconflow
extract_latent: False
generate_carla: False
carla_output_dir: carla_scenarios


