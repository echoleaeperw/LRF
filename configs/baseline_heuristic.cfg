# Heuristic Attack baseline: closest vehicle as attacker + fixed aggressive weights, no LLM.
# Use: python src/adv_scenario_gen.py -c configs/baseline_heuristic.cfg

out: ./out/baseline_heuristic_out

data_dir: ./data/nuscenes
data_version: trainval
split: val
val_size: 400
seq_interval: 10
shuffle: False
num_workers: 0
batch_size: 1

ckpt: ./model_ckpt/traffic_model.pth
feasibility_check_sep: True
planner: 'hardcode'
planner_cfg: 'default'

viz: True
save: True

num_iters: 200
lr: 0.05

init_loss_motion_prior_ext: 0.01
init_loss_match_ext: 10.0

# Aggressive fixed weights for heuristic baseline
loss_coll_veh: 5.0
loss_coll_veh_plan: 5.0
loss_coll_env: 10.0
loss_init_z: 0.5
loss_init_z_atk: 0.05
loss_motion_prior: 1.0
loss_motion_prior_atk: 0.001
loss_motion_prior_ext: 0.0001
loss_match_ext: 10.0
loss_adv_crash: 30.0
loss_ttc: 10.0
loss_min_dist_lat: 5.0
loss_yaw_rate: 5.0
loss_yaw_rate_ego: 5.0
loss_yaw_rate_non_ego: 5.0

# No LLM: attacker = closest feasible vehicle
use_llm: False
