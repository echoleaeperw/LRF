# Ablation i (reviewer): maximally aggressive hand-tuned static weights.
# All risk-facing loss terms pushed to upper bound; no LLM involved.
# This is the strongest fixed-weight baseline to prove that the LLM's gain
# cannot be attributed to mere weight magnitude inflation.
# Use: python src/adv_scenario_gen.py -c configs/ablation_aggressive_fixed.cfg

out: ./out/ablation_aggressive_fixed_out

data_dir: ./data/nuscenes
data_version: trainval
split: val
val_size: 400
seq_interval: 10
shuffle: False
num_workers: 0
batch_size: 1

ckpt: ./model_ckpt/traffic_model.pth
feasibility_check_sep: True
planner: 'hardcode'
planner_cfg: 'default'

viz: True
save: True

num_iters: 200
lr: 0.05

init_loss_motion_prior_ext: 0.01
init_loss_match_ext: 10.0

# Maximally aggressive risk weights (upper-bound static baseline)
loss_coll_veh: 30.0
loss_coll_veh_plan: 30.0
loss_coll_env: 10.0
loss_init_z: 0.5
loss_init_z_atk: 0.01
loss_motion_prior: 1.0
loss_motion_prior_atk: 0.001
loss_motion_prior_ext: 0.0001
loss_match_ext: 10.0
loss_adv_crash: 10.0
loss_ttc: 6.0
loss_min_dist_lat: 5.0
loss_yaw_rate: 3.0
loss_yaw_rate_ego: 3.0
loss_yaw_rate_non_ego: 3.0

use_llm: False
ablation_mode: aggressive_fixed
